name: Build FlowCityRP

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # needed only for creating releases on v* tags

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Forge 1.16.5 toolchain (ForgeGradle 5 / MCP 1.16.5) is built and tested for Java 8.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '8'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '7.6.4'

      - name: Build and test
        shell: bash
        run: |
          set -o pipefail
          gradle build --continue 2>&1 | tee build.log

      - name: Jar summary
        shell: bash
        run: |
          {
            echo '## Built jars'
            echo '```'
            ls -l core/build/libs forge/build/libs
            for j in forge/build/libs/FlowCityForge-*.jar core/build/libs/FlowCityCore-*.jar; do
              echo "--- $j"
              unzip -l "$j" | grep -E 'flowcity/(forge|core)/|mods.toml|plugin.yml|libs/(hikari|mysql)/[^/]*/$' | head -n 40
            done
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Logs need a GitHub login; the run summary is visible on the run page itself.
      - name: Failure summary
        if: failure()
        shell: bash
        run: |
          {
            echo '## Build failed - relevant output'
            echo '```'
            grep -n -E 'FAILED|error:|What went wrong|Exception|expected:|Caused by|> Task .* FAILED|warning: \[' build.log | head -n 120
            echo '--- last 60 lines ---'
            tail -n 60 build.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload jars
        uses: actions/upload-artifact@v4
        with:
          name: FlowCityRP-${{ github.sha }}
          path: |
            core/build/libs/FlowCityCore-*.jar
            forge/build/libs/FlowCityForge-*.jar
          if-no-files-found: error

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: '**/build/reports/tests/'

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            core/build/libs/FlowCityCore-*.jar
            forge/build/libs/FlowCityForge-*.jar
