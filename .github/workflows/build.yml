name: Build FlowCityRP

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # needed only for creating releases on v* tags

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Forge 1.16.5 toolchain (ForgeGradle 5 / MCP 1.16.5) is built and tested for Java 8.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '7.6.4'

      - name: Build and test
        run: gradle build --stacktrace

      - name: Upload jars
        uses: actions/upload-artifact@v4
        with:
          name: FlowCityRP-${{ github.sha }}
          path: |
            core/build/libs/FlowCityCore-*.jar
            forge/build/libs/FlowCityForge-*.jar
          if-no-files-found: error

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: '**/build/reports/tests/'

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            core/build/libs/FlowCityCore-*.jar
            forge/build/libs/FlowCityForge-*.jar
