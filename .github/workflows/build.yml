name: Build FlowCityRP

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # needed only for creating releases on v* tags

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Forge 1.16.5 toolchain (ForgeGradle 5 / MCP 1.16.5) is built and tested for Java 8.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '8'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '7.6.4'

      - name: Build and test
        shell: bash
        run: |
          set -o pipefail
          gradle build --continue 2>&1 | tee build.log

      # Annotations are visible on the run page even without a GitHub login.
      - name: Verify jars
        shell: bash
        run: |
          ok=1
          for pattern in 'core/build/libs/FlowCityCore-*.jar' 'forge/build/libs/FlowCityForge-*.jar'; do
            f=$(ls $pattern 2>/dev/null | head -n 1)
            if [ -z "$f" ]; then
              echo "::error title=Missing jar::$pattern was not built"; ok=0; continue
            fi
            classes=$(unzip -l "$f" | grep -c '\.class$')
            echo "::notice title=Built $(basename "$f")::$(stat -c %s "$f") bytes, $classes classes, mods.toml=$(unzip -l "$f" | grep -c 'META-INF/mods.toml'), plugin.yml=$(unzip -l "$f" | grep -c ' plugin.yml$')"
          done
          core=$(ls core/build/libs/FlowCityCore-*.jar | head -n 1)
          listing=$(unzip -l "$core")
          if ! grep -q "com/flowcity/libs/slf4j/LoggerFactory.class" <<<"$listing"; then
            echo "::error title=slf4j missing::FlowCityCore does not bundle relocated slf4j"; ok=0
          fi
          if grep -q " org/slf4j/" <<<"$listing"; then
            echo "::error title=slf4j not relocated::FlowCityCore contains org/slf4j classes"; ok=0
          fi
          [ "$ok" = 1 ]

      # Annotations are public on the run page (logs need a GitHub login).
      - name: Failure annotations
        if: failure()
        shell: bash
        run: |
          set +e +o pipefail
          if [ ! -f build.log ]; then echo "::error::build.log missing"; exit 1; fi
          # up to 10 error annotations: javac errors, failed tasks/tests, assertion and exception lines
          grep -E '\.java:[0-9]+: error:|FAILED|expected: <|Exception|What went wrong|> Task .*FAILED' build.log \
            | grep -v 'Deprecated Gradle' | head -n 10 | sed 's/%/%25/g; s/\r//g' \
            | while IFS= read -r l; do echo "::error::${l#*/FLOW-TEAM-CORE-V3/}"; done
          # up to 10 warning annotations: the last lines of the build output
          tail -n 10 build.log | sed 's/%/%25/g; s/\r//g' | while IFS= read -r l; do echo "::warning::${l}"; done
          exit 1

      - name: Failure summary
        if: failure()
        shell: bash
        run: |
          {
            echo '## Build failed - relevant output'
            echo '```'
            grep -n -E 'FAILED|error:|What went wrong|Exception|expected:|Caused by|> Task .* FAILED|warning: \[' build.log | head -n 120
            echo '--- last 60 lines ---'
            tail -n 60 build.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload jars
        uses: actions/upload-artifact@v4
        with:
          name: FlowCityRP-${{ github.sha }}
          path: |
            core/build/libs/FlowCityCore-*.jar
            forge/build/libs/FlowCityForge-*.jar
          if-no-files-found: error

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: '**/build/reports/tests/'

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            core/build/libs/FlowCityCore-*.jar
            forge/build/libs/FlowCityForge-*.jar
