plugins {
    id 'net.minecraftforge.gradle' version '5.1.+'
}

base {
    archivesName = 'FlowCityForge-1.16.5'
}

sourceCompatibility = '1.8'
targetCompatibility = '1.8'

// FlowCityCommon sources are compiled straight into the mod jar.
sourceSets.main.java.srcDir rootProject.file('common/src/main/java')

minecraft {
    // For 1.16.x "official" maps fields/methods to Mojang names; class names stay MCP.
    mappings channel: 'official', version: project.minecraft_version

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'info'
            mods {
                flowcity {
                    source sourceSets.main
                }
            }
        }
        server {
            workingDirectory project.file('run-server')
            property 'forge.logging.console.level', 'info'
            arg 'nogui'
            mods {
                flowcity {
                    source sourceSets.main
                }
            }
        }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${project.minecraft_version}-${project.forge_version}"
}

processResources {
    inputs.property 'version', project.version
    filesMatching('META-INF/mods.toml') {
        expand 'version': project.version
    }
}

jar {
    manifest {
        attributes([
                'Specification-Title'     : 'flowcity',
                'Specification-Vendor'    : 'FlowCity Roleplay',
                'Specification-Version'   : '1',
                'Implementation-Title'    : 'FlowCityForge',
                'Implementation-Version'  : project.version,
                'Implementation-Vendor'   : 'FlowCity Roleplay',
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
    finalizedBy 'reobfJar'
}
